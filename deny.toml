# cargo-deny policy — run manually via `cargo deny check`.
# Not wired into CI: the ecosystem's gates are fmt/clippy/test; this file
# records the licensing and duplication posture for review.

[graph]
all-features = false

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
