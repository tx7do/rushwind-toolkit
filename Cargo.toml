[workspace]
resolver = "2"
members = ["crates/*"]
# rush-ui 是 Tauri 桌面壳：构建依赖 webkit2gtk 等系统开发包，独立于
# workspace——不进 members，也不拖累主仓的 build/test/clippy。
exclude = ["apps/rush-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
repository = "https://github.com/tx7do/rushwind-toolkit"

[workspace.lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
rush-gen = { path = "crates/rush-gen", version = "0.1.0" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
walkdir = "2"
